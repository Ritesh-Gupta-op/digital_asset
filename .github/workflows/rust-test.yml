name: Rust Smart Contract Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  rust-test:
    name: Soroban Contract Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify & Build License Registry Contract
        run: |
          cd contracts/license_registry
          cargo check
          cargo build --target wasm32-unknown-unknown --release

      - name: Verify & Build Royalty Router Contract
        run: |
          cd contracts/royalty_router
          cargo check
          cargo build --target wasm32-unknown-unknown --release
