name: Continuous Integration & Deployment

on:
  push:
    branches: [ main ]

jobs:
  validate:
    name: Validate Frontend & Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build

  deploy:
    name: Production Deployment (Vercel)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Deployment Status Check
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "Production build validated cleanly! Set VERCEL_TOKEN in repository secrets for automatic deployment."

